<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lily Pad Hop</title>
    <style>
        /* Strict Fullscreen Reset */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #001100;
            overflow: hidden; /* Removes scrollbars */
        }
        
        #ruffle-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Force Ruffle to fill the container */
        ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>
    <div id="ruffle-container"></div>

    <!-- Ruffle Engine -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <!-- Firebase SDK Compat libraries (Drop-in replacements for simple HTML sites) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // *** PASTE YOUR FIREBASE CONFIG HERE ***
        // You can find this in your Firebase Console -> Project Settings -> General -> Your Apps
        const firebaseConfig = {
            apiKey: "AIzaSyCMSpev_qJxhNkmyYcsyj7wWip1LWyHv_Y",
            authDomain: "lilypadhop-59ea5.firebaseapp.com",
            projectId: "lilypadhop-59ea5", 
            storageBucket: "lilypadhop-59ea5.firebasestorage.app",
            messagingSenderId: "740869273083",
            appId: "1:740869273083:web:90cf5be99b980b580d075e"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let rufflePlayerInstance = null;

        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            
            rufflePlayerInstance = player;

            player.config = {
                "allowScriptAccess": true,
                "scale": "showAll", 
                "backgroundColor": "#001100",
                "letterbox": "on", 
                "autoplay": "on",
                "unmuteOverlay": "hidden",
                "quality": "low" // Maintained your quality setting
            };

            player.load("LilyPadHop.swf");
        });
        
        // --- Helper to talk to Flash ---
        function callAS3(func, ...args) {
            if (rufflePlayerInstance && typeof rufflePlayerInstance[func] === "function") {
                rufflePlayerInstance[func](...args);
            }
        }

        // --- FIREBASE FIRESTORE INTEGRATION ---

        let tempLoginPoints = 0;
        let tempLoginXmlData = "";

        window.js_login = async function(user, pass) {
            console.log("JS: Logging in via Firebase...");
            try {
                // Using lowercase username as the document ID so it's case insensitive
                const docRef = db.collection("users").doc(user.toLowerCase());
                const doc = await docRef.get();

                if (doc.exists) {
                    const data = doc.data();
                    if (data.password === pass) {
                        if (data.email) {
                            callAS3("as_onLoginResult", "success", data.username || user, Number(data.points) || 0, data.xmlData || "");
                        } else {
                            // Old account, request email linking and load their points/xmlData into Flash
                            callAS3("as_onLoginResult", "need_email", data.username || user, Number(data.points) || 0, data.xmlData || "");
                        }
                    } else {
                        callAS3("as_onLoginResult", "error", "Incorrect password", 0, "");
                    }
                } else {
                    callAS3("as_onLoginResult", "error", "User not found. Please create an account.", 0, "");
                }
            } catch(e) {
                console.error("Firebase Login Error:", e);
                callAS3("as_onLoginResult", "error", "Database connection failed.", 0, "");
            }
        }

        let verificationCode = "";
        let verificationEmail = "";
        let verificationUser = "";
        let verificationPass = "";
        let verificationContext = "";

        window.js_sendVerificationCode = async function(email, username, context, password) {
            // Generate 6-digit code
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            verificationCode = code;
            verificationEmail = email;
            verificationUser = username;
            verificationPass = password || "";
            verificationContext = context;

            console.log(`JS: Generated verification code ${code} for ${email} (${context})`);
            try {
                const response = await fetch("https://vercel-emailing.vercel.app/api/send-code", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        code: code,
                        username: username
                    })
                });

                const resData = await response.json();
                if (response.ok) {
                    callAS3("as_onCodeSent", "success", "");
                } else {
                    callAS3("as_onCodeSent", "error", resData.error || "Failed to send code.");
                }
            } catch(e) {
                console.error("Verification code error:", e);
                callAS3("as_onCodeSent", "error", "Network error.");
            }
        }

        window.js_checkVerificationCode = async function(enteredCode) {
            console.log("JS: Checking code:", enteredCode);
            if (enteredCode === verificationCode) {
                try {
                    if (verificationContext === "register") {
                        // Register the user
                        const docRef = db.collection("users").doc(verificationUser.toLowerCase());
                        await docRef.set({
                            username: verificationUser,
                            password: verificationPass,
                            email: verificationEmail,
                            points: 0,
                            xmlData: "",
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        await db.collection("leaderboard").doc(verificationUser.toLowerCase()).set({
                            username: verificationUser,
                            points: 0
                        });
                        callAS3("as_onCodeVerified", "success_register", "");

                    } else if (verificationContext === "recover") {
                        // Save email and send recovery password
                        const docRef = db.collection("users").doc(verificationUser.toLowerCase());
                        const doc = await docRef.get();
                        if (doc.exists) {
                            const data = doc.data();
                            await docRef.update({
                                email: verificationEmail,
                                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            // Call forgot password mailing backend
                            const response = await fetch("https://vercel-emailing.vercel.app/api/forgot-password", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    username: data.username || verificationUser,
                                    email: verificationEmail,
                                    password: data.password
                                })
                            });
                            if (response.ok) {
                                callAS3("as_onCodeVerified", "success_recover", "Recovery email successfully sent!");
                            } else {
                                callAS3("as_onCodeVerified", "error", "Failed to send recovery email.");
                            }
                        } else {
                            callAS3("as_onCodeVerified", "error", "Username not found.");
                        }

                    } else if (verificationContext === "add_email") {
                        // Link email for logged-in user
                        const docRef = db.collection("users").doc(verificationUser.toLowerCase());
                        await docRef.update({
                            email: verificationEmail,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        // Complete login success flow inside Flash
                        callAS3("as_onCodeVerified", "success_add_email", "");
                        callAS3("as_onLoginResult", "success", verificationUser, tempLoginPoints, tempLoginXmlData);
                    }
                } catch(e) {
                    console.error("Firestore update error inside verification:", e);
                    callAS3("as_onCodeVerified", "error", "Database error occurred.");
                }
            } else {
                callAS3("as_onCodeVerified", "error", "Invalid verification code.");
            }
        }

        window.js_register = async function(user, pass, email) {
            console.log("JS: Registering Account via Firebase...");
            try {
                const docRef = db.collection("users").doc(user.toLowerCase());
                const doc = await docRef.get();

                if (doc.exists) {
                    callAS3("as_onLoginResult", "error", "Username already exists.", 0, "");
                } else {
                    // Create the new user with email
                    await docRef.set({
                        username: user,
                        password: pass,
                        email: email,
                        points: 0,
                        xmlData: "",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    // Create public leaderboard entry
                    await db.collection("leaderboard").doc(user.toLowerCase()).set({
                        username: user,
                        points: 0
                    });
                    // Route back to existing login handler to auto-login
                    callAS3("as_onLoginResult", "success", "", 0, "");
                }
            } catch(e) {
                console.error("Firebase Register Error:", e);
                callAS3("as_onLoginResult", "error", "Database connection failed.", 0, "");
            }
        }

        window.js_forgotPassword = async function(user) {
            console.log("JS: Forgot Password recovery initiated for user:", user);
            try {
                const docRef = db.collection("users").doc(user.toLowerCase());
                const doc = await docRef.get();

                if (doc.exists) {
                    const data = doc.data();
                    if (data.email) {
                        // Send POST request to Vercel Serverless Function
                        const response = await fetch("https://vercel-emailing.vercel.app/api/forgot-password", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                username: data.username || user,
                                email: data.email,
                                password: data.password
                            })
                        });

                        const resData = await response.json();
                        if (response.ok) {
                            callAS3("as_onForgotPasswordResult", "success", "Recovery email successfully sent!");
                        } else {
                            callAS3("as_onForgotPasswordResult", "error", resData.error || "Email delivery failed.");
                        }
                    } else {
                        // Trigger email prompt screen for old accounts
                        callAS3("as_onForgotPasswordResult", "need_email", user);
                    }
                } else {
                    callAS3("as_onForgotPasswordResult", "error", "Username not found.");
                }
            } catch(e) {
                console.error("Firebase/Email Forgot Password Error:", e);
                callAS3("as_onForgotPasswordResult", "error", "Connection failed. Please try again.");
            }
        }

        window.js_registerEmailAndRecover = async function(user, email) {
            console.log("JS: Registering email for old user & recovering:", user, "->", email);
            try {
                const docRef = db.collection("users").doc(user.toLowerCase());
                const doc = await docRef.get();

                if (doc.exists) {
                    const data = doc.data();
                    // 1. Update the email field in Firestore user doc
                    await docRef.update({
                        email: email,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // 2. Send POST request to Vercel Serverless Function
                    const response = await fetch("https://vercel-emailing.vercel.app/api/forgot-password", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: data.username || user,
                            email: email,
                            password: data.password
                        })
                    });

                    const resData = await response.json();
                    if (response.ok) {
                        callAS3("as_onForgotPasswordResult", "success", "Recovery email successfully sent!");
                    } else {
                        callAS3("as_onForgotPasswordResult", "error", resData.error || "Email delivery failed.");
                    }
                } else {
                    callAS3("as_onForgotPasswordResult", "error", "Username not found.");
                }
            } catch(e) {
                console.error("Firebase Register Email and Recover Error:", e);
                callAS3("as_onForgotPasswordResult", "error", "Connection failed. Please try again.");
            }
        }

        window.js_saveScore = async function(user, pass, points) {
            console.log("JS: Saving Score via Firebase...");
            try {
                const docRef = db.collection("users").doc(user.toLowerCase());
                const doc = await docRef.get();
                
                if (doc.exists && doc.data().password === pass) {
                    const currentPoints = Number(doc.data().points) || 0;
                    const newPoints = currentPoints + Number(points);

                    // Update user doc
                    await docRef.update({
                        points: newPoints,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Update leaderboard doc with absolute points
                    await db.collection("leaderboard").doc(user.toLowerCase()).set({
                        username: doc.data().username || user,
                        points: newPoints
                    }, { merge: true });

                    console.log("Score Saved Successfully");
                }
            } catch(e) {
                console.error("Firebase Save Score Error:", e);
            }
        }
        
        window.js_saveCloudData = async function(user, pass, xmlData) {
            console.log("JS: Saving Cloud XML Data via Firebase...");
            try {
                const docRef = db.collection("users").doc(user.toLowerCase());
                const doc = await docRef.get();
                
                if (doc.exists && doc.data().password === pass) {
                    await docRef.update({
                        xmlData: xmlData,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    console.log("Cloud Data Saved Successfully");
                }
            } catch(e) {
                console.error("Firebase Save Cloud Data Error:", e);
            }
        }

        window.js_getLeaderboard = async function() {
            console.log("JS: Fetching Leaderboard via Firebase...");
            try {
                // Fetch top 20 users sorted by points from the public leaderboard collection
                const snapshot = await db.collection("leaderboard")
                                         .orderBy("points", "desc")
                                         .limit(20)
                                         .get();
                
                let users = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.points > 0) { // Don't show people with 0 points
                        users.push(data.username + " : " + data.points);
                    }
                });

                // Join them exactly how AS3 expects: "User1 : 100|User2 : 50"
                let lbString = users.join("|");
                callAS3("as_onLeaderboardResult", lbString);
                
            } catch(e) {
                console.error("Firebase Leaderboard Error:", e);
                callAS3("as_onLeaderboardResult", "Error: Database failed.");
            }
        }
    </script>
</body>
</html>
